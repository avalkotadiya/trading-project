apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sahara-ingress
  namespace: sahara-trade
spec:
  rules:
    - host: sahara.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sahara-app
                port:
                  number: 80
    - host: realtime.sahara.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sahara-realtime
                port:
                  number: 80
