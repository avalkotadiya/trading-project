apiVersion: apps/v1
kind: Deployment
metadata:
  name: sahara-realtime
  namespace: sahara-trade
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sahara-realtime
  template:
    metadata:
      labels:
        app: sahara-realtime
    spec:
      containers:
        - name: realtime
          image: sahara-trade-realtime:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: sahara-config
            - secretRef:
                name: sahara-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sahara-realtime
  namespace: sahara-trade
spec:
  selector:
    app: sahara-realtime
  ports:
    - port: 80
      targetPort: 3001
